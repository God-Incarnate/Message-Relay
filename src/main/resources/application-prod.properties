### Production properties (example - override with real values in CI/CD)

# Kafka bootstrap servers - replace with your rate-sentinel Kafka broker address
spring.kafka.bootstrap-servers=rate-sentinel-kafka:29092

# Topic names - match rate-sentinel's topics
kafka.topics.email=email
kafka.topics.sms=sms
kafka.topics.whatsapp=whatsapp
kafka.topics.payment=payment
kafka.topics.dlq=delivery-dlq

spring.elasticsearch.uris=http://elasticsearch:9200

logging.level.root=INFO

