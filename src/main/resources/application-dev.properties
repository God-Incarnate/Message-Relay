### Development properties (used with --spring.profiles.active=dev)
# Points to rate-sentinel's Kafka instance running on localhost:29092
spring.kafka.bootstrap-servers=localhost:29092

# Topic names - match rate-sentinel's topics
kafka.topics.email=email
kafka.topics.sms=sms
kafka.topics.whatsapp=whatsapp
kafka.topics.payment=payment
kafka.topics.dlq=delivery-dlq

spring.elasticsearch.uris=http://localhost:9200

logging.level.root=INFO
logging.level.com.prashant=DEBUG


