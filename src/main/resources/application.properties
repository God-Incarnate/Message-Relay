
### Kafka
# Bootstrap servers pointing to rate-sentinel's Kafka instance
spring.kafka.bootstrap-servers=localhost:29092

# Topic names - match rate-sentinel's topics
kafka.topics.email=email
kafka.topics.sms=sms
kafka.topics.whatsapp=whatsapp
kafka.topics.payment=payment
kafka.topics.dlq=delivery-dlq

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200

# Additional runtime tweaks
spring.main.allow-bean-definition-overriding=true
spring.main.banner-mode=off
#spring.main.log-startup-info=false

# Resilience4j retry configuration (FR-4.1)
resilience4j.retry.instances.messageSender.max-attempts=3
resilience4j.retry.instances.messageSender.wait-duration=2s
resilience4j.retry.instances.messageSender.enable-exponential-backoff=true
resilience4j.retry.instances.messageSender.exponential-backoff-multiplier=2
resilience4j.retry.instances.messageSender.retry-exceptions=java.lang.RuntimeException

# Resilience4j circuit breaker configuration (FR-4.2)
resilience4j.circuitbreaker.instances.messageSender.sliding-window-size=10
resilience4j.circuitbreaker.instances.messageSender.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.messageSender.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.messageSender.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.messageSender.permitted-number-of-calls-in-half-open-state=3
server.port=8090
# Actuator endpoints required for observability
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.order=down,out-of-service,degraded,up,unknown
management.endpoint.health.status.http-mapping.degraded=200
management.health.mongo.enabled=false
management.health.kafka.enabled=false
management.health.elasticsearch.enabled=false

# Keep console output concise: app logs at INFO, framework internals mostly WARN.
logging.level.root=INFO
logging.level.com.prashant=INFO
logging.level.org.springframework=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.mongodb.driver=WARN
logging.level.org.springframework.data.repository.config=WARN


